name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev libjpeg-dev pkg-config
      - name: Build application
        run: make all
      - name: Run unattended checks
        run: make check
      - name: Compile all harnesses
        run: make tests
